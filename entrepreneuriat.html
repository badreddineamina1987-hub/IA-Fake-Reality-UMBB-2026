<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>يوم دراسي: ريادة الأعمال والابتكار · UMBB 22.11.2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Cairo:wght@400;600;700;800;900&family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0d1640;--night2:#1a1f5e;--ink:#f4f6ff;--soft:#b9c2e8;
  --coral:#ff6b4a;--amber:#ffb020;--teal:#17c3b2;--blue:#3d7bff;--violet:#8b5cf6;--green:#3ddc84;--pink:#ff5fa2;
  --glass:rgba(255,255,255,.08);--gline:rgba(255,255,255,.16);
  --pop:'Poppins','Cairo',sans-serif;--disp:'Baloo Bhaijaan 2','Cairo',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;overflow:hidden;color:var(--ink);font-family:'Cairo',system-ui,sans-serif}
body.idle,body.idle *{cursor:none!important}
.lat{direction:ltr;unicode-bidi:isolate;font-family:var(--pop)}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;overflow:hidden;
  background:radial-gradient(ellipse 120% 80% at 50% 120%,#3a1d6e 0%,#1d1f63 35%,#0d1640 70%,#091030 100%)}
/* dawn glow */
.dawn{position:absolute;left:-10%;right:-10%;bottom:-420px;height:700px;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(255,138,76,.55),rgba(255,95,162,.25) 40%,transparent 70%);filter:blur(30px);animation:dawn 14s ease-in-out infinite alternate}
@keyframes dawn{to{transform:translateY(-40px) scale(1.05);opacity:.85}}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.38;mix-blend-mode:screen}
.b1{width:620px;height:620px;background:var(--violet);top:-160px;right:-120px;animation:float1 22s ease-in-out infinite alternate}
.b2{width:520px;height:520px;background:var(--teal);top:260px;left:-200px;animation:float2 26s ease-in-out infinite alternate}
.b3{width:460px;height:460px;background:var(--blue);top:-120px;left:520px;opacity:.25;animation:float1 30s ease-in-out infinite alternate-reverse}
@keyframes float1{to{transform:translate(-140px,120px) scale(1.15)}}
@keyframes float2{to{transform:translate(160px,-90px) scale(.9)}}
/* blueprint grid */
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:48px 48px;
  mask-image:radial-gradient(ellipse at center,#000 30%,transparent 80%);-webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 80%)}
#fx{position:absolute;inset:0;z-index:2;pointer-events:none}
#confetti{position:absolute;inset:0;z-index:95;pointer-events:none}
.doodles{position:absolute;inset:0;z-index:1;pointer-events:none}
.doodles svg{position:absolute;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;opacity:.10;animation:drift linear infinite}
@keyframes drift{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(-40px) rotate(8deg)}100%{transform:translateY(0) rotate(0)}}
/* segmented ring motif */
.ringm{position:absolute;pointer-events:none;z-index:1}
.ringm svg{width:100%;height:100%;animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:.35}}

/* top bar */
.top{position:absolute;top:0;left:0;right:0;height:104px;z-index:70;display:flex;align-items:center;justify-content:space-between;padding:0 40px;direction:ltr;
  background:linear-gradient(to bottom,rgba(9,16,48,.85),rgba(9,16,48,.25));border-bottom:1px solid rgba(255,255,255,.08)}
.logos{display:flex;align-items:center;gap:26px}
.logos img{display:block;filter:drop-shadow(0 2px 10px rgba(0,0,0,.35))}
.logos .umbb{height:78px}.logos .nesda{height:52px}.logos .cde{height:54px}
.logos .sep{width:1px;height:46px;background:rgba(255,255,255,.2)}
.clockbox{text-align:center}
.clock{font-family:var(--pop);font-weight:800;font-size:40px;letter-spacing:.02em;background:linear-gradient(90deg,var(--amber),var(--coral));-webkit-background-clip:text;background-clip:text;color:transparent}
.cdate{font-family:var(--pop);font-size:13px;letter-spacing:.32em;color:var(--soft)}
.status{display:flex;align-items:center;gap:14px;direction:rtl;max-width:600px}
.pill{font-family:var(--pop);font-weight:700;font-size:15px;letter-spacing:.12em;padding:7px 16px;border-radius:30px;background:var(--coral);color:#fff;white-space:nowrap;box-shadow:0 6px 20px rgba(255,107,74,.45);direction:ltr}
.pill.live::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:#fff;margin-right:8px;animation:blink 1s steps(2) infinite}
.pill.calm{background:var(--teal);box-shadow:0 6px 20px rgba(23,195,178,.4)}
.stxt{font-size:19px;font-weight:700;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.stxt small{display:block;color:var(--soft);font-size:15px;font-weight:600;font-family:var(--pop)}

/* bottom */
.bot{position:absolute;bottom:0;left:0;right:0;height:64px;z-index:70;display:flex;direction:ltr;background:rgba(9,16,48,.9);border-top:1px solid rgba(255,255,255,.08)}
.gewbox{flex:none;display:flex;align-items:center;padding:0 22px;background:rgba(255,255,255,.04);border-right:1px solid rgba(255,255,255,.1)}
.gewbox img{height:54px}
.ticker{flex:1;overflow:hidden;white-space:nowrap;display:flex;align-items:center}
.ticker .run{display:inline-flex;animation:tick 75s linear infinite}
.ticker span{font-size:23px;font-weight:700;color:#fff;padding:0 30px;direction:rtl;display:inline-flex;align-items:center;gap:30px}
.ticker span i{width:12px;height:12px;border-radius:3px;transform:rotate(45deg);display:inline-block}
@keyframes tick{from{transform:translateX(-50%)}to{transform:translateX(0)}}
.botinfo{flex:none;display:flex;align-items:center;gap:16px;padding:0 22px;font-family:var(--pop);font-size:14px;color:var(--soft);border-left:1px solid rgba(255,255,255,.1)}
.botinfo b{color:#fff}
#prog{position:absolute;bottom:64px;left:0;height:5px;z-index:75;width:0;background:linear-gradient(90deg,var(--teal),var(--blue),var(--violet),var(--pink),var(--coral),var(--amber));border-radius:0 3px 3px 0}
#dots{position:absolute;bottom:82px;left:50%;translate:-50% 0;z-index:75;display:flex;gap:8px;direction:ltr}
#dots i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.2);transition:.35s}
#dots i.on{width:32px;border-radius:6px;background:var(--amber)}
#dots i.done{background:rgba(255,255,255,.5)}
#paused{position:absolute;top:118px;left:50%;translate:-50% 0;z-index:76;font-family:var(--pop);font-weight:700;font-size:16px;letter-spacing:.2em;color:#091030;background:var(--amber);padding:6px 18px;border-radius:20px;display:none;direction:ltr}
#paused.on{display:block}

/* wipe transition */
#wipe{position:absolute;inset:0;z-index:90;pointer-events:none;display:flex;flex-direction:column}
#wipe i{flex:1;transform:translateX(105%)}
#wipe.go i{animation:wipe 1.15s cubic-bezier(.7,0,.3,1) forwards}
@keyframes wipe{0%{transform:translateX(105%)}45%,55%{transform:translateX(0)}100%{transform:translateX(-105%)}}

/* scenes */
#scene{position:absolute;left:120px;right:120px;top:128px;bottom:110px;z-index:10;display:flex;align-items:center;justify-content:center}
.sc{width:100%}
.r{opacity:0;transform:translateY(34px) scale(.97);filter:blur(6px)}
.r.in{animation:pop .85s cubic-bezier(.2,1.25,.35,1) forwards}
@keyframes pop{to{opacity:1;transform:none;filter:none}}
.kick{display:inline-flex;align-items:center;gap:12px;font-family:var(--pop);font-weight:700;font-size:18px;letter-spacing:.22em;color:var(--amber);direction:ltr;margin-bottom:6px}
.kick::before{content:"";width:46px;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--amber),var(--coral))}
.hd{font-family:var(--disp);font-weight:800;font-size:72px;line-height:1.2}
.grad{background:linear-gradient(90deg,var(--teal),var(--blue) 45%,var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.grad2{background:linear-gradient(90deg,var(--amber),var(--coral) 55%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.under{position:relative;display:inline-block}
.under::after{content:"";position:absolute;right:0;bottom:6px;height:14px;width:0;border-radius:8px;background:linear-gradient(90deg,var(--amber),var(--coral));opacity:.55;z-index:-1;transition:width 1s .6s cubic-bezier(.2,.8,.2,1)}
.in .under::after,.under.in::after{width:100%}
.card{background:var(--glass);border:1px solid var(--gline);border-radius:24px;backdrop-filter:blur(10px);position:relative;overflow:hidden}
.ic{fill:none;stroke-linecap:round;stroke-linejoin:round}
.ic path,.ic circle,.ic polyline,.ic line,.ic rect{stroke-dasharray:1;stroke-dashoffset:1}
.in .ic path,.in .ic circle,.in .ic polyline,.in .ic line,.in .ic rect,.ic.in path,.ic.in circle,.ic.in rect,.ic.in line{animation:draw 1.6s cubic-bezier(.6,0,.3,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* title */
.t-sc{text-align:center;position:relative}
.bulbwrap{position:relative;width:190px;height:190px;margin:0 auto 4px}
.bulbwrap .glow{position:absolute;inset:-60px;border-radius:50%;background:radial-gradient(circle,rgba(255,196,64,.75),rgba(255,138,76,.25) 40%,transparent 70%);opacity:0;transform:scale(.4)}
.bulbwrap.lit .glow{animation:lit 1s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes lit{to{opacity:1;transform:scale(1)}}
.bulbwrap svg{position:relative;width:100%;height:100%}
.bulbwrap .rays line{stroke:var(--amber);stroke-width:2.4;opacity:0}
.bulbwrap.lit .rays line{animation:ray .5s forwards}
@keyframes ray{to{opacity:1}}
.bulbwrap .fill{fill:var(--amber);opacity:0;transition:opacity .6s}
.bulbwrap.lit .fill{opacity:.9}
.t-org{font-size:26px;font-weight:700;color:#dfe4ff;line-height:1.55}
.t-org small{display:block;font-size:21px;color:var(--soft);font-weight:600}
.t-first{font-family:var(--disp);color:var(--amber);font-size:40px;font-weight:700;margin-top:14px}
.t-title{font-family:var(--disp);font-weight:800;font-size:118px;line-height:1.1;margin:4px 0}
.t-slog{font-size:42px;font-weight:800;color:#fff}
.chips{display:flex;gap:20px;justify-content:center;margin-top:30px}
.chip{display:flex;align-items:center;gap:14px;padding:14px 28px;border-radius:40px;background:var(--glass);border:1px solid var(--gline);font-size:25px;font-weight:700}
.chip b{color:var(--amber)}
.chip .dot{width:14px;height:14px;border-radius:50%}

/* slogan */
.slg{text-align:center;position:relative}
.slg .gewbig{height:150px;margin:0 auto 30px;display:block}
.slg .w1{font-family:var(--pop);font-weight:900;font-size:132px;line-height:1.05;direction:ltr;letter-spacing:-.01em}
.slg .w1 span{display:inline-block;opacity:0;transform:translateY(60px) rotate(-6deg)}
.slg .w1 span.in{animation:letter .7s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes letter{to{opacity:1;transform:none}}
.slg .ar{font-family:var(--disp);font-size:58px;font-weight:800;margin-top:26px;color:var(--amber)}

/* timeline */
.tl{position:relative;margin-top:30px;padding-right:110px}
.tl .line{position:absolute;right:52px;top:14px;bottom:14px;width:5px;border-radius:3px;background:linear-gradient(var(--teal),var(--violet),var(--coral));transform-origin:top;transform:scaleY(0);transition:transform 1.8s cubic-bezier(.6,0,.3,1)}
.tl.in .line{transform:scaleY(1)}
.ti{position:relative;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;padding:20px 30px;margin-bottom:16px;border-radius:20px;background:var(--glass);border:1px solid var(--gline)}
.ti::before{content:"";position:absolute;right:-74px;top:50%;width:30px;height:30px;margin-top:-15px;border-radius:50%;background:var(--c,var(--teal));box-shadow:0 0 0 7px rgba(255,255,255,.08),0 0 24px var(--c,var(--teal))}
.ti .tt{font-size:30px;font-weight:800;line-height:1.4}
.ti .tt small{display:block;font-size:23px;color:var(--soft);font-weight:600;margin-top:4px}
.ti .tt b{color:var(--amber)}
.ti .tt .ppl{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:10px}
.ti .tt .ppl span{font-size:22px;font-weight:700;padding:6px 16px;border-radius:20px;background:rgba(255,255,255,.07);border:1px solid var(--gline)}
.ti .tt .ppl span b{color:#fff}
.ti .tt .ppl span em{font-style:normal;color:var(--soft);font-weight:600;font-size:18px;margin-inline-start:8px}
.ti .tm{font-family:var(--pop);font-weight:800;font-size:28px;direction:ltr;padding:10px 20px;border-radius:14px;background:rgba(0,0,0,.25);color:var(--c,var(--teal));white-space:nowrap}
.ti.brk{border-style:dashed;opacity:.8}
.ti.live{border-color:var(--coral);background:rgba(255,107,74,.14);box-shadow:0 10px 40px rgba(255,107,74,.25)}
.ti.live .tm::after{content:" ● LIVE";font-size:15px;color:var(--coral);animation:blink 1s steps(2) infinite}

/* pipeline */
.pipe-sc{text-align:center}
.pipe{position:relative;height:470px;margin-top:10px}
.pipe svg.path{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.pipe .route{fill:none;stroke:rgba(255,255,255,.28);stroke-width:4;stroke-dasharray:4 16;stroke-linecap:round}
.st{position:absolute;width:290px;text-align:center;translate:50% 0;z-index:2}
.st .bub{width:170px;height:170px;margin:0 auto;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:3px solid var(--c);box-shadow:0 0 0 12px rgba(255,255,255,.04),0 14px 50px rgba(0,0,0,.3)}
.st .bub svg{width:84px;height:84px;stroke:var(--c);stroke-width:1.7}
.st .nm{font-family:var(--disp);font-size:40px;font-weight:800;margin-top:14px}
.st .en{font-family:var(--pop);font-weight:700;font-size:16px;letter-spacing:.25em;color:var(--c)}
.st.done .bub{background:var(--c)}.st.done .bub svg{stroke:#0d1640}
.pipe-note{font-size:30px;font-weight:700;color:#dfe4ff;margin-top:20px}

/* speakers */
.spk{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:34px}
.sp{padding:0 0 30px;text-align:center}
.sp .band{height:120px;background:linear-gradient(135deg,var(--c),var(--c2));position:relative}
.sp .band::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.08) 0 14px,transparent 14px 28px)}
.sp .av{width:150px;height:150px;border-radius:50%;margin:-78px auto 0;position:relative;z-index:2;background:#14205a;border:6px solid #14205a;display:grid;place-items:center;box-shadow:0 0 0 4px var(--c)}
.sp .av svg{width:70px;height:70px;stroke:var(--c);stroke-width:1.7}
.sp .tm{display:inline-block;margin-top:16px;font-family:var(--pop);font-weight:800;font-size:24px;padding:6px 18px;border-radius:20px;background:rgba(255,255,255,.08);direction:ltr}
.sp .nm{font-family:var(--disp);font-size:40px;font-weight:800;margin-top:10px;line-height:1.2}
.sp .rl{font-size:21px;color:var(--c);font-weight:700;margin:6px 26px 0;min-height:62px;line-height:1.45}
.sp .tp{margin:18px 26px 0;padding:16px;border-radius:16px;background:rgba(0,0,0,.22);font-size:25px;font-weight:700;line-height:1.45}
.sp .tp small{display:block;color:var(--soft);font-size:17px;font-family:var(--pop);letter-spacing:.2em;margin-bottom:4px}
.sp.live{box-shadow:0 0 0 3px var(--coral),0 20px 60px rgba(255,107,74,.35)}
.sp.live .tm::after{content:"  ● LIVE";color:var(--coral);font-size:15px;animation:blink 1s steps(2) infinite}

/* message */
.msg{display:grid;grid-template-columns:420px 1fr;gap:70px;align-items:center}
.msg .big-ic{width:420px;height:420px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,rgba(255,255,255,.1),transparent 70%);border:2px dashed rgba(255,255,255,.18);position:relative}
.msg .big-ic svg{width:230px;height:230px;stroke-width:1.2}
.msg .big-ic::before{content:"";position:absolute;inset:-22px;border-radius:50%;border:3px solid transparent;border-top-color:var(--c);border-right-color:var(--c);animation:spin 6s linear infinite}
.msg .q{font-family:var(--disp);font-weight:800;font-size:92px;line-height:1.2}
.msg .en{font-family:var(--pop);font-weight:700;font-size:30px;color:var(--soft);direction:ltr;text-align:right;margin-top:16px;letter-spacing:.04em}
.msg .who{margin-top:26px;font-size:28px;font-weight:700;color:var(--c)}

/* organizers */
.org{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:34px}
.og{padding:28px 30px;display:flex;align-items:center;gap:24px;min-height:160px}
.og .oi{flex:none;width:96px;height:96px;border-radius:24px;display:grid;place-items:center;background:var(--c)}
.og .oi svg{width:52px;height:52px;stroke:#0d1640;stroke-width:1.8}
.og .oi img{max-width:80px;max-height:60px}
.og .nm{font-family:var(--disp);font-size:36px;font-weight:800;line-height:1.15}
.og .ds{font-size:20px;color:var(--soft);font-weight:600;margin-top:4px;line-height:1.45}

/* start */
#start{position:absolute;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;cursor:pointer;text-align:center;
  background:radial-gradient(ellipse 120% 80% at 50% 120%,#3a1d6e,#1d1f63 40%,#0d1640 75%)}
#start .lg{display:flex;gap:40px;align-items:center;direction:ltr}
#start .lg img{height:110px}
#start .gw{height:110px}
#start .go{margin-top:20px;font-family:var(--pop);font-weight:800;font-size:44px;padding:20px 60px;border-radius:60px;background:linear-gradient(90deg,var(--amber),var(--coral));color:#fff;box-shadow:0 14px 50px rgba(255,107,74,.5);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05);box-shadow:0 18px 70px rgba(255,107,74,.7)}}
#start .ar{font-family:var(--disp);font-size:36px;font-weight:700}
#start .keys{font-family:var(--pop);color:var(--soft);font-size:17px;direction:ltr}
#start .keys b{color:var(--amber)}
#toast{position:absolute;top:120px;right:40px;z-index:160;background:rgba(9,16,48,.95);border:1px solid var(--gline);padding:10px 20px;border-radius:12px;font-family:var(--pop);font-size:18px;opacity:0;transition:opacity .3s;direction:ltr}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="stage">
  <div class="dawn"></div><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="grid"></div>
  <div class="doodles" id="doodles"></div>
  <div class="ringm" style="width:560px;height:560px;left:-200px;bottom:-200px;opacity:.22"><svg viewBox="0 0 100 100" id="ringA"></svg></div>
  <div class="ringm" style="width:380px;height:380px;right:-130px;top:130px;opacity:.16"><svg viewBox="0 0 100 100" id="ringB" style="animation-direction:reverse"></svg></div>
  <canvas id="fx" width="1920" height="1080"></canvas>

  <div class="top">

const cf=$('confetti'),cc=cf.getContext('2d');let CF=[];
function confetti(x,y,n=140){for(let i=0;i<n;i++){const a=rand(-Math.PI,0),sp=rand(6,18);CF.push({x,y,vx:Math.cos(a)*sp*rand(.4,1.3),vy:Math.sin(a)*sp,w:rand(8,16),h:rand(5,10),r:rand(0,6),vr:rand(-.3,.3),c:pick(COLS),l:rand(90,160)})}}
(function cl(){cc.clearRect(0,0,1920,1080);CF=CF.filter(p=>p.l>0);for(const p of CF){p.l--;p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
  cc.save();cc.globalAlpha=Math.min(1,p.l/40);cc.translate(p.x,p.y);cc.rotate(p.r);cc.fillStyle=p.c;cc.fillRect(-p.w/2,-p.h/2,p.w,p.h);cc.restore()}requestAnimationFrame(cl)})();

/* ---------- SOUND: bright, uplifting ---------- */
let AC=null,master=null,muted=false,volLvl=2,music=false;const VOLS=[0,.35,.7,1.1];
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=VOLS[volLvl];
  const comp=AC.createDynamicsCompressor();master.connect(comp).connect(AC.destination)}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function setVol(){if(master)master.gain.setTargetAtTime(muted?0:VOLS[volLvl],AC.currentTime,.1);$('vol').textContent=muted?'🔇':'🔊 '+volLvl}
function pluck(f,v=.12,delay=0,d=1.2){const a=ac();if(!a)return;const t=a.currentTime+delay;[[1,'triangle',v],[2,'sine',v*.35],[3,'sine',v*.12]].forEach(([m,ty,vv])=>{const o=a.createOscillator(),g=a.createGain();o.type=ty;o.frequency.value=f*m;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vv,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d/m);o.connect(g).connect(master);o.start(t);o.stop(t+d+.05)})}
function swoosh(delay=0,up=true){const a=ac();if(!a)return;const t=a.currentTime+delay,d=.7,b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1;
  const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='bandpass';f.Q.value=1.2;f.frequency.setValueAtTime(up?400:3000,t);f.frequency.exponentialRampToValueAtTime(up?3500:400,t+d);
  const g=a.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+d*.5);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f).connect(g).connect(master);s.start(t)}
const PENTA=[523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.5,1567.98];
const CHORDS=[[261.63,329.63,392],[220,261.63,329.63],[174.61,220,261.63],[196,246.94,293.66]];
const SFX={
  strum:()=>{const ch=pick(CHORDS);[...ch,ch[0]*2].forEach((f,i)=>pluck(f*2,.09,i*.06,1.6))},
  pop:()=>pluck(pick(PENTA),.07,0,.6),
  sparkle:()=>{for(let i=0;i<6;i++)pluck(PENTA[PENTA.length-1-i]*1,.05,i*.05,.5)},
  rise:()=>{[0,2,4,5,7].forEach((k,i)=>pluck(PENTA[k],.08,i*.09,1))},
  wipe:()=>swoosh(0,true),
  ding:()=>{pluck(1046.5,.1,0,1.8);pluck(1567.98,.06,.08,1.8)}
};
function startMusic(){const a=ac();if(!a||music)return;music=true;
  const padG=a.createGain();padG.gain.value=.045;const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1200;lp.connect(padG).connect(master);
  let ci=0;const oscs=[];for(let i=0;i<3;i++){const o=a.createOscillator();o.type='sawtooth';o.connect(lp);o.start();oscs.push(o);const o2=a.createOscillator();o2.type='sawtooth';o2.detune.value=9;o2.connect(lp);o2.start();oscs.push(o2)}
  const setCh=()=>{const ch=CHORDS[ci++%4];oscs.forEach((o,k)=>o.frequency.setTargetAtTime(ch[Math.floor(k/2)],a.currentTime,.4))};setCh();setInterval(setCh,4800);
  let step=0;setInterval(()=>{const ch=CHORDS[(ci+3)%4];const pat=[0,2,1,2,0,2,1,3];const k=pat[step%8];const f=k===3?ch[0]*4:ch[k]*2;if(step%8!==7||Math.random()<.5)pluck(f,.035,0,.5);if(step%16===0)pluck(ch[0]/2,.09,0,1.2);step++},300);
}

/* ---------- CLOCK + LIVE ---------- */
const toMin=s=>{const [h,m]=s.split(':').map(Number);return h*60+m};
const SCHED=[...OPEN.map(o=>({s:o.s,e:o.e,t:o.t})),...TALKS.map(t=>({s:t.s,e:t.e,t:t.n+' — '+t.t})),...PART2.map(p=>({s:p.s,e:p.e,t:p.t}))];
function nowInfo(){const d=new Date(),ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');return{d,ds,m:d.getHours()*60+d.getMinutes()}}
function updClock(){const {d,ds,m}=nowInfo();$('clock').textContent=d.toLocaleTimeString('fr-FR');const pill=$('spill'),st=$('stxt');
  if(ds<EVENT_DATE){pill.textContent='SOON';pill.className='pill calm';st.innerHTML='يوم دراسي: ريادة الأعمال والابتكار<small>22.11.2026 · 08:30</small>';return}
  if(ds>EVENT_DATE){pill.textContent='THANK YOU';pill.className='pill calm';st.innerHTML='شكراً لكل المشاركين<small>22.11.2026</small>';return}
  const cur=SCHED.find(x=>m>=toMin(x.s)&&m<toMin(x.e)),nxt=SCHED.find(x=>toMin(x.s)>m);
  if(cur){pill.textContent='LIVE';pill.className='pill live';st.innerHTML=`${cur.t}<small><span style="direction:ltr;unicode-bidi:isolate;display:inline-block">${cur.s} → ${cur.e}${nxt?' · NEXT '+nxt.s:''}</span></small>`}
  else if(nxt){pill.textContent='NEXT '+nxt.s;pill.className='pill calm';st.innerHTML=`${nxt.t}<small>القادم</small>`}
  else{pill.textContent='ON AIR';pill.className='pill calm';st.innerHTML='أشغال اليوم الدراسي متواصلة<small>ENTREPRENEURSHIP & INNOVATION</small>'}}

   <div class="org">${O.map(o=>`<div class="card og r" style="--c:${o[2]}"><div class="oi">${o[3].startsWith('img:')?`<img src="data:image/png;base64,${IMG[o[3].slice(4)]}" alt="" style="filter:brightness(0) saturate(100%) invert(8%) sepia(40%) hue-rotate(200deg)">`:svgI(o[3])}</div><div><div class="nm ${/^[A-Z]/.test(o[0])?'lat':''}" style="${/^[A-Z]/.test(o[0])?'text-align:right':''}">${o[0]}</div><div class="ds">${o[1]}</div></div></div>`).join('')}</div></div>`}}
];

/* ---------- ENGINE ---------- */
const N=SCENES.length;let cur=-1,timers=[],paused=false,tStart=0,remain=0,running=false;
$('dots').innerHTML=SCENES.map(()=>'<i></i>').join('');const dots=[...$('dots').children];
const T=(f,ms)=>{const t=setTimeout(f,ms);timers.push(t);return t};
const _st=window.setTimeout;window.setTimeout=(f,ms)=>{const t=_st(f,ms);timers.push(t);return t};
function show(i){timers.forEach(clearTimeout);timers=[];cur=(i+N)%N;const S=SCENES[cur],box=$('scene'),first=!box.firstElementChild;
  const w=$('wipe');if(!first){w.classList.remove('go');void w.offsetWidth;w.classList.add('go');SFX.wipe()}
  T(()=>{box.innerHTML=S.html();SFX.strum();
    const items=[...box.querySelectorAll('.r')];const gap=S.fx==='sp'||S.fx==='pipe'?380:S.fx==='tl'?260:230;
    items.forEach((el,k)=>T(()=>{el.classList.add('in');if(k>0)SFX.pop()},250+k*gap));
    if(S.after)S.after();
  },first?0:560);
  dots.forEach((d,k)=>d.className=k===cur?'on':k<cur?'done':'');$('scn').textContent=String(cur+1).padStart(2,'0')+'/'+N;
  remain=S.d;startProg();}
let raf=null;
function startProg(){tStart=performance.now();const p=$('prog'),dur=remain,base=SCENES[cur].d;cancelAnimationFrame(raf);
  (function f(){if(paused)return;const left=dur-(performance.now()-tStart);p.style.width=(100*(1-Math.max(0,left)/base))+'%';if(left<=0){show(cur+1);return}raf=requestAnimationFrame(f)})();}
function togglePause(){paused=!paused;$('paused').classList.toggle('on',paused);if(paused){remain-=performance.now()-tStart;cancelAnimationFrame(raf)}else startProg()}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=_st(()=>t.classList.remove('on'),2000)}
async function start(){if(running)return;running=true;ac();setVol();startMusic();SFX.rise();
  const st=$('start');st.style.transition='opacity .8s';st.style.opacity=0;_st(()=>st.style.display='none',800);
  try{await document.documentElement.requestFullscreen()}catch(e){}
  try{if('wakeLock' in navigator){let wl=await navigator.wakeLock.request('screen');document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible')try{wl=await navigator.wakeLock.request('screen')}catch(e){}})}}catch(e){}
  _st(()=>show(0),700);}
$('start').onclick=start;
addEventListener('keydown',e=>{const k=e.key;
  if(!running){if(k==='Enter'||k===' '){e.preventDefault();start()}return}
  if(k===' '){e.preventDefault();togglePause()}
  else if(k==='ArrowRight'||k==='PageDown'){if(paused)togglePause();show(cur+1)}
  else if(k==='ArrowLeft'||k==='PageUp'){if(paused)togglePause();show(cur-1)}
  else if(k==='f'||k==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}
  else if(k==='m'||k==='M'){muted=!muted;setVol();toast(muted?'SOUND OFF':'SOUND ON')}
  else if(k==='v'||k==='V'){volLvl=volLvl%3+1;muted=false;setVol();toast('VOLUME '+volLvl)}
  else if(k==='Home')show(0);});
let idleT;addEventListener('mousemove',()=>{document.body.classList.remove('idle');clearTimeout(idleT);idleT=_st(()=>document.body.classList.add('idle'),2500)});
})();
