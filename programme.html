<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>برنامج الملتقى الوطني — الخداع الإعلاني والتسويقي · UMBB 19.11.2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#03060d;--cyan:#00e5ff;--mag:#ff2bd6;--red:#ff2a3d;--gold:#f5c542;--green:#2bff88;--txt:#e8f2ff;--dim:#8796b3;
  --panel:rgba(8,20,42,.66);--line:rgba(0,229,255,.28);--mono:'JetBrains Mono',ui-monospace,monospace;--hud:'Orbitron','JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;overflow:hidden;color:var(--txt);font-family:'Cairo',system-ui,sans-serif}
body.idle,body.idle *{cursor:none!important}
.en{direction:ltr;unicode-bidi:isolate;font-family:var(--mono)}
/* fixed 1920x1080 stage scaled to the screen */
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;background:var(--bg);overflow:hidden}
#bg{position:absolute;inset:0}
.grid{position:absolute;inset:-50%;pointer-events:none;background-image:linear-gradient(rgba(0,229,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.07) 1px,transparent 1px);
  background-size:70px 70px;transform:perspective(700px) rotateX(62deg) translateY(32%);animation:gridmove 5s linear infinite;
  mask-image:linear-gradient(to top,#000,transparent 55%);-webkit-mask-image:linear-gradient(to top,#000,transparent 55%)}
@keyframes gridmove{to{background-position:0 70px,0 0}}
.scan{position:absolute;inset:0;pointer-events:none;z-index:80;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
.scanbar{position:absolute;left:0;right:0;height:160px;z-index:81;pointer-events:none;background:linear-gradient(to bottom,transparent,rgba(0,229,255,.07),transparent);animation:scanbar 6s linear infinite}
@keyframes scanbar{from{top:-160px}to{top:100%}}
.vignette{position:absolute;inset:0;pointer-events:none;z-index:79;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.85))}
#flash{position:absolute;inset:0;pointer-events:none;z-index:90;background:var(--red);opacity:0}
#flash.go{animation:flash .7s ease-out}
@keyframes flash{0%{opacity:.5}100%{opacity:0}}
#alertframe{position:absolute;inset:0;z-index:78;pointer-events:none;box-shadow:inset 0 0 0 0 var(--red);opacity:0}
#alertframe.on{animation:alertframe 1s steps(2) 4}
@keyframes alertframe{0%{opacity:1;box-shadow:inset 0 0 120px 20px rgba(255,42,61,.55)}100%{opacity:0}}
@keyframes blink{50%{opacity:.25}}
@keyframes spin{to{rotate:360deg}}

/* radar */
.radar{position:absolute;left:46px;bottom:150px;width:170px;height:170px;border-radius:50%;border:1px solid rgba(0,229,255,.35);z-index:5;
  background:radial-gradient(circle,transparent 0 30%,rgba(0,229,255,.12) 30.5%,transparent 31% 62%,rgba(0,229,255,.12) 62.5%,transparent 63%);opacity:.75}
.radar::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(0,229,255,.55),transparent 22%);animation:spin 3s linear infinite}
.radar i{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red);animation:blink .8s steps(2) infinite}
.radar span{position:absolute;bottom:-26px;left:0;right:0;text-align:center;font-family:var(--hud);font-size:11px;letter-spacing:.25em;color:var(--cyan);direction:ltr}
/* side data rain */
.rain{position:absolute;top:110px;bottom:150px;width:64px;z-index:4;overflow:hidden;font-family:var(--mono);font-size:13px;line-height:1.25;color:rgba(255,42,61,.55);direction:ltr;text-align:center;
  mask-image:linear-gradient(to bottom,transparent,#000 15%,#000 85%,transparent);-webkit-mask-image:linear-gradient(to bottom,transparent,#000 15%,#000 85%,transparent)}
.rain.l{left:8px}.rain.r{right:8px;color:rgba(0,229,255,.45)}
.rain div{animation:rain 14s linear infinite;white-space:pre}
@keyframes rain{from{transform:translateY(-50%)}to{transform:translateY(0)}}

/* HUD */
.hud{position:absolute;left:0;right:0;z-index:70;display:flex;align-items:center;justify-content:space-between;padding:0 40px;direction:ltr}
.hud.top{top:0;height:96px;border-bottom:1px solid rgba(0,229,255,.16);background:linear-gradient(to bottom,rgba(3,6,13,.95),rgba(3,6,13,.4))}
.brand{display:flex;align-items:center;gap:18px}
.brand img{height:70px;filter:drop-shadow(0 0 10px rgba(0,229,255,.35))}
.brand .alpec{height:58px;border-radius:8px}
.brand .bt{font-size:17px;line-height:1.35;direction:rtl;text-align:right}
.brand .bt b{color:var(--gold);font-size:19px}
.clockbox{text-align:center}
.clock{font-family:var(--hud);font-weight:900;font-size:40px;color:var(--cyan);text-shadow:0 0 18px rgba(0,229,255,.6);letter-spacing:.06em}
.clockdate{font-family:var(--hud);font-size:12px;letter-spacing:.3em;color:var(--dim)}
.status{display:flex;align-items:center;gap:14px;max-width:640px;direction:rtl}
.pill{font-family:var(--hud);font-weight:900;font-size:14px;letter-spacing:.2em;padding:7px 14px;border:2px solid var(--red);color:var(--red);background:rgba(255,42,61,.1);
  box-shadow:0 0 18px rgba(255,42,61,.5);animation:blink 1s steps(2) infinite;white-space:nowrap;direction:ltr}
.pill.ok{border-color:var(--green);color:var(--green);box-shadow:0 0 18px rgba(43,255,136,.4)}
.stxt{font-size:19px;font-weight:700;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.stxt small{display:block;color:var(--dim);font-size:15px;font-weight:600}
.hud.bot{bottom:0;height:62px;background:linear-gradient(to top,rgba(3,6,13,.98),rgba(3,6,13,.6));border-top:1px solid rgba(255,212,0,.25);padding:0;overflow:hidden}
.ticker{flex:1;overflow:hidden;white-space:nowrap;direction:ltr;height:100%;display:flex;align-items:center;
  background:repeating-linear-gradient(-45deg,rgba(255,212,0,.07) 0 18px,transparent 18px 36px)}
.ticker .run{display:inline-flex;animation:tick 70s linear infinite;gap:0}
.ticker span{font-size:22px;font-weight:800;color:#ffe9a8;padding:0 34px;direction:rtl}
.ticker span::before{content:"⚠";color:var(--red);margin-left:14px;animation:blink 1s steps(2) infinite;display:inline-block}
@keyframes tick{from{transform:translateX(-50%)}to{transform:translateX(0)}}
.botinfo{flex:none;display:flex;align-items:center;gap:16px;padding:0 24px;font-family:var(--hud);font-size:13px;letter-spacing:.2em;color:var(--dim);background:rgba(3,6,13,.95);height:100%;border-right:1px solid rgba(255,212,0,.3)}
.botinfo b{color:var(--cyan)}
#prog{position:absolute;bottom:62px;left:0;height:4px;z-index:75;background:linear-gradient(90deg,var(--cyan),var(--mag),var(--red));box-shadow:0 0 14px var(--cyan);width:0}
#dots{position:absolute;bottom:76px;left:50%;translate:-50% 0;z-index:75;display:flex;gap:6px;direction:ltr}
#dots i{width:9px;height:9px;border-radius:2px;background:rgba(255,255,255,.12);transition:.3s}
#dots i.on{background:var(--cyan);box-shadow:0 0 10px var(--cyan);width:26px}
#dots i.done{background:rgba(0,229,255,.35)}
#paused{position:absolute;top:110px;left:50%;translate:-50% 0;z-index:76;font-family:var(--hud);font-size:16px;letter-spacing:.3em;color:var(--gold);border:1px solid var(--gold);padding:6px 16px;display:none;direction:ltr;background:rgba(0,0,0,.6)}
#paused.on{display:block;animation:blink 1.2s steps(2) infinite}

/* scenes */
#scene{position:absolute;left:110px;right:110px;top:120px;bottom:100px;z-index:10;display:flex;align-items:center;justify-content:center}
.sc{width:100%}
.sc.out{animation:glitchout .65s steps(6) forwards}
@keyframes glitchout{0%{clip-path:inset(0 0 0 0);transform:none}20%{clip-path:inset(10% 0 55% 0);transform:translate(-30px,0)}40%{clip-path:inset(60% 0 8% 0);transform:translate(26px,0);filter:hue-rotate(90deg)}
  60%{clip-path:inset(30% 0 40% 0);transform:translate(-14px,0)}80%{clip-path:inset(48% 0 48% 0);transform:scaleX(1.3)}100%{clip-path:inset(50% 0 50% 0);opacity:0}}
.r{opacity:0;transform:translateY(30px)}
.r.in{animation:rise .8s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.kicker{font-family:var(--hud);font-size:17px;letter-spacing:.38em;color:var(--cyan);display:flex;align-items:center;gap:14px;direction:ltr;justify-content:flex-end;margin-bottom:8px}
.kicker::before{content:"";width:60px;height:2px;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.kicker.red{color:var(--red)}.kicker.red::before{background:var(--red);box-shadow:0 0 10px var(--red)}
h1{font-size:96px;font-weight:900;line-height:1.2}
h2{font-size:62px;font-weight:900;line-height:1.25}
.hl{background:linear-gradient(90deg,var(--cyan),var(--mag));-webkit-background-clip:text;background-clip:text;color:transparent}
.hlr{background:linear-gradient(90deg,var(--gold),var(--red));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:22px;color:var(--cyan);font-family:var(--mono);direction:ltr;text-align:right;margin-top:4px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(8px);position:relative;overflow:hidden}
.panel::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(0,229,255,.08),transparent);animation:sheen 5s infinite;pointer-events:none}
@keyframes sheen{to{left:130%}}
.glitch{position:relative;display:inline-block}
.glitch::before,.glitch::after{content:attr(data-text);position:absolute;inset:0;pointer-events:none}
.glitch::before{color:var(--mag);clip-path:inset(0 0 62% 0);animation:g1 2.6s infinite steps(1)}
.glitch::after{color:var(--cyan);clip-path:inset(58% 0 0 0);animation:g2 3.1s infinite steps(1)}
@keyframes g1{0%,86%,100%{transform:none;opacity:0}87%{transform:translate(-8px,-2px);opacity:.9}90%{transform:translate(6px,1px);opacity:.9}93%{transform:translate(-3px,0);opacity:.9}}
@keyframes g2{0%,78%,100%{transform:none;opacity:0}79%{transform:translate(8px,2px);opacity:.9}82%{transform:translate(-6px,-1px);opacity:.9}85%{transform:translate(2px,0);opacity:.9}}
.danger{display:inline-flex;gap:.6em;align-items:center;padding:.35em 1.1em;border:2px solid var(--red);color:var(--red);font-family:var(--hud);font-weight:800;letter-spacing:.22em;font-size:20px;background:rgba(255,42,61,.08);box-shadow:0 0 24px rgba(255,42,61,.45);animation:blink 1s steps(2) infinite;direction:ltr}

/* title scene */
.t-scene{text-align:center;position:relative}
.t-scene .ring{position:absolute;left:50%;top:50%;width:820px;height:820px;translate:-50% -50%;border-radius:50%;border:1px dashed rgba(0,229,255,.25);animation:spin 40s linear infinite;pointer-events:none}
.t-scene .ring.r2{width:1000px;height:1000px;border:1px solid rgba(255,43,214,.15);animation-direction:reverse;animation-duration:70s}
.t-scene .logo{height:150px;filter:drop-shadow(0 0 30px rgba(0,229,255,.45))}
.t-scene .org{font-size:26px;font-weight:700;color:#cfe0f7;line-height:1.6}
.t-scene .first{color:var(--gold);font-size:34px;font-weight:800;margin:14px 0 4px}
.t-scene h1{font-size:84px;text-shadow:0 0 40px rgba(0,229,255,.35)}
.t-scene .tline2{font-size:46px;font-weight:800;color:#dbe9ff;margin-top:6px}
.meta{display:flex;gap:26px;justify-content:center;margin-top:26px}
.meta .panel{padding:14px 28px;font-size:24px;font-weight:800}
.meta b{color:var(--cyan)}

/* timeline */
.tl{display:grid;gap:12px;margin-top:22px}
.ti{display:grid;grid-template-columns:200px 1fr;gap:22px;align-items:center;padding:14px 24px;border-radius:12px;background:rgba(8,20,42,.55);border:1px solid rgba(0,229,255,.18);position:relative}
.ti .tm{font-family:var(--hud);font-weight:900;font-size:24px;color:var(--cyan);direction:ltr;text-align:center}
.ti .tt{font-size:27px;font-weight:800;line-height:1.45}
.ti .tt small{display:block;font-size:21px;color:#b9c9e2;font-weight:600}
.ti .tt b{color:var(--gold)}
.ti.live{border-color:var(--red);background:rgba(255,42,61,.12);box-shadow:0 0 40px rgba(255,42,61,.3)}
.ti.live::before{content:"● LIVE";position:absolute;left:18px;top:10px;font-family:var(--hud);font-size:13px;color:var(--red);letter-spacing:.2em;animation:blink 1s steps(2) infinite;direction:ltr}
.ti.brk{border-style:dashed;opacity:.85}

/* keynote */
.kn{display:grid;grid-template-columns:1fr 520px;gap:50px;align-items:center}
.kn .who{font-size:64px;font-weight:900;line-height:1.2}
.kn .role{font-size:28px;color:var(--gold);font-weight:700;margin:8px 0 22px}
.kn .ttl{font-size:34px;font-weight:800;line-height:1.6;padding:26px 32px;border-inline-start:5px solid var(--mag)}
.kn .tbox{text-align:center;padding:40px 30px}
.kn .tbox .big{font-family:var(--hud);font-weight:900;font-size:88px;color:var(--cyan);text-shadow:0 0 30px rgba(0,229,255,.6);direction:ltr}
.kn .tbox .lbl{font-size:24px;color:var(--dim);margin-top:6px}
.mic{width:150px;height:150px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;position:relative;border:2px solid var(--mag)}
.mic::before,.mic::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:2px solid rgba(255,43,214,.5);animation:pulse 1.8s infinite}
.mic::after{animation-delay:.9s}
@keyframes pulse{from{transform:scale(.85);opacity:1}to{transform:scale(1.35);opacity:0}}
.mic svg{width:64px;height:64px;stroke:var(--mag);fill:none;stroke-width:1.8}

/* workshop */
.ws-head{display:grid;grid-template-columns:1fr auto;gap:30px;align-items:end;margin-bottom:18px}
.ws-head h2{font-size:58px}
.ws-meta{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap}
.chip{padding:8px 18px;border-radius:30px;border:1px solid var(--line);background:rgba(0,229,255,.07);font-size:22px;font-weight:700}
.chip b{color:var(--gold)}
.chip.page{font-family:var(--hud);direction:ltr;color:var(--cyan);font-size:18px;letter-spacing:.15em}
.chip.online{border-color:rgba(43,255,136,.5);color:var(--green)}
.chip.online::before{content:"● ";animation:blink 1s steps(2) infinite}
.qrp{display:flex;gap:16px;align-items:center;padding:12px 16px}
.qrp .q{width:150px;height:150px;background:#fff;border-radius:10px;padding:8px;position:relative;box-shadow:0 0 28px rgba(0,229,255,.5)}
.qrp .q svg{width:100%;height:100%;display:block}
.qrp .q::after{content:"";position:absolute;left:-4px;right:-4px;height:3px;background:var(--cyan);box-shadow:0 0 14px var(--cyan);top:0;animation:qscan 2s ease-in-out infinite alternate}
@keyframes qscan{to{top:100%}}
.qrp .ql{font-size:18px;color:var(--dim);line-height:1.5}
.qrp .ql b{display:block;font-family:var(--mono);color:var(--txt);font-size:19px;direction:ltr;text-align:right}
.talks{display:grid;gap:14px}
.talk{display:grid;grid-template-columns:170px 1fr;gap:24px;align-items:center;padding:16px 26px;border-radius:14px;background:rgba(8,20,42,.62);border:1px solid rgba(0,229,255,.2);position:relative;overflow:hidden;min-height:132px}
.talk::before{content:"";position:absolute;top:0;bottom:0;right:0;width:5px;background:linear-gradient(var(--cyan),var(--mag))}
.talk .tm{font-family:var(--hud);font-weight:900;font-size:26px;color:var(--cyan);text-align:center;direction:ltr;line-height:1.25}
.talk .tm small{display:block;font-size:16px;color:var(--dim)}
.talk .ttl{font-size:28px;font-weight:800;line-height:1.45}
.talk .ttl.lat{direction:ltr;text-align:right;font-family:'Cairo',sans-serif}
.talk .ppl{margin-top:8px;display:flex;flex-wrap:wrap;gap:8px 22px;font-size:21px}
.talk .ppl span{color:var(--gold);font-weight:800}
.talk .ppl span em{font-style:normal;color:#9fb2d0;font-weight:600;font-size:18px}
.talk .ppl span em::before{content:" — "}
.talk .ppl .uni{color:#9fb2d0;font-weight:600;font-size:18px}
.talk.in.hit{animation:rise .8s cubic-bezier(.2,.8,.2,1) forwards,hit 1s}
@keyframes hit{0%{border-color:var(--red);box-shadow:0 0 50px rgba(255,42,61,.5);background:rgba(255,42,61,.18)}100%{}}
.talk .beam{position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(0,229,255,.18),transparent);transform:translateX(100%);pointer-events:none}
.talk.in .beam{animation:beam 1.2s ease-out .2s}
@keyframes beam{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
.talk.live{border-color:var(--red);box-shadow:0 0 40px rgba(255,42,61,.35)}
.talk.live::after{content:"● LIVE";position:absolute;left:16px;top:10px;font-family:var(--hud);font-size:13px;color:var(--red);letter-spacing:.2em;animation:blink 1s steps(2) infinite;direction:ltr}
.disc{margin-top:14px;text-align:center;font-family:var(--hud);letter-spacing:.3em;color:var(--mag);font-size:16px}
.disc span{font-family:'Cairo';letter-spacing:0;font-size:24px;font-weight:800}

/* alerts */
.al{text-align:center;position:relative}
.al .big{font-size:120px;font-weight:900;line-height:1.15}
.al .num{font-family:var(--hud);font-weight:900;font-size:230px;line-height:1;direction:ltr;color:var(--red);text-shadow:0 0 60px rgba(255,42,61,.7)}
.al .num.cy{color:var(--cyan);text-shadow:0 0 60px rgba(0,229,255,.6)}
.al .num.gd{color:var(--gold);text-shadow:0 0 60px rgba(245,197,66,.6)}
.al .lab{font-size:44px;font-weight:800;margin-top:10px}
.al .src{font-size:20px;color:var(--dim);margin-top:18px}
.al .en2{font-family:var(--mono);font-size:30px;color:var(--cyan);direction:ltr;margin-top:14px;letter-spacing:.06em}
.tape{position:absolute;left:-12%;right:-12%;height:58px;display:flex;align-items:center;overflow:hidden;background:repeating-linear-gradient(-45deg,#ffd400 0 30px,#111 30px 60px);box-shadow:0 0 40px rgba(255,212,0,.35);z-index:-1}
.tape .run{display:flex;animation:tape 16s linear infinite;direction:ltr}
.tape span{font-family:var(--hud);font-weight:900;color:#000;background:#ffd400;padding:4px 18px;margin:0 40px;white-space:nowrap;letter-spacing:.2em;font-size:18px}
@keyframes tape{to{transform:translateX(-50%)}}
.flags{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:40px}
.flags .panel{padding:26px;font-size:30px;font-weight:800;border-color:rgba(255,42,61,.5)}
.flags .panel::before{content:"⚠";display:block;font-size:46px;color:var(--red);animation:blink .8s steps(2) infinite}

/* committee */
.cm{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}
.cmc{padding:14px 20px}
.cmc .ro{font-size:18px;color:var(--cyan);font-weight:700}
.cmc .nm{font-size:27px;font-weight:900;margin-top:2px}
.cmc .nm small{display:block;font-size:17px;color:var(--dim);font-weight:600}
.cmc.top{border-color:rgba(245,197,66,.5)}.cmc.top .ro{color:var(--gold)}

/* contact */
.ct{display:grid;grid-template-columns:1fr auto;gap:60px;align-items:center}
.ct .line{font-size:40px;font-weight:800;margin:14px 0;display:flex;gap:18px;align-items:center}
.ct .line .en{color:var(--cyan)}
.ct .qrp .q{width:260px;height:260px}

/* start screen */
#start{position:absolute;inset:0;z-index:200;background:radial-gradient(ellipse at center,#06101f,#010207 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;cursor:pointer;text-align:center}
#start img{height:170px;filter:drop-shadow(0 0 30px rgba(0,229,255,.5))}
#start .big{font-family:var(--hud);font-size:46px;color:var(--cyan);letter-spacing:.14em;text-shadow:0 0 22px var(--cyan);animation:blink 1.4s steps(2) infinite}
#start .ar{font-size:34px;font-weight:800}
#start .keys{font-family:var(--mono);color:var(--dim);font-size:18px;direction:ltr;line-height:1.8}
#start .keys b{color:var(--gold)}
#toast{position:absolute;top:110px;right:40px;z-index:160;background:rgba(8,20,42,.95);border:1px solid var(--cyan);padding:10px 20px;border-radius:8px;font-size:20px;opacity:0;transition:opacity .3s;direction:ltr}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg"></canvas>
  <div class="grid"></div>

          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';

        buffer.put(0, 4);
      }

      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);

        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);

function tone(f,d,type='sine',v=.15,to,delay=0){const a=ac();if(!a)return;const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(master);o.start(t);o.stop(t+d+.05)}
function noise(d,v=.2,fq=1800,q=1,delay=0){const a=ac();if(!a)return;const t=a.currentTime+delay,b=a.createBuffer(1,Math.floor(a.sampleRate*d),a.sampleRate),c=b.getChannelData(0);
  for(let i=0;i<c.length;i++)c[i]=(Math.random()*2-1)*(Math.random()<.3?1:.3);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=fq;f.Q.value=q;
  const g=a.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f).connect(g).connect(master);s.start(t)}
const SFX={
  ping:()=>{tone(1320,.6,'sine',.07);tone(1980,.4,'sine',.025,null,.02)},
  tick:()=>tone(2600,.02,'square',.018),
  boom:()=>{tone(110,1.4,'sine',.6,28);noise(.5,.25,180,.7)},
  glitch:()=>{noise(.3,.3,2800,.8);tone(90,.25,'sawtooth',.1,35);noise(.12,.25,6000,2,.12)},
  siren:()=>{tone(1100,1.1,'sawtooth',.05,300);tone(1105,1.1,'square',.03,305)},
  klaxon:(n=3)=>{for(let i=0;i<n;i++){tone(520,.32,'sawtooth',.09,null,i*.42);tone(392,.32,'square',.06,null,i*.42+.02)}},
  alarm:(n=3)=>{for(let i=0;i<n;i++){tone(880,.22,'square',.06,640,i*.46);tone(640,.22,'square',.06,880,i*.46+.23)}},
  heart:()=>{tone(58,.18,'sine',.5,40);tone(52,.2,'sine',.38,36,.22)},
  whoosh:()=>{noise(.6,.12,600,.6);tone(180,.5,'sine',.05,900)},
  geiger:()=>{const n=Math.floor(rand(3,9));for(let i=0;i<n;i++)noise(.012,.25,4000,3,Math.random()*.5)},
  riser:()=>{tone(80,1.6,'sawtooth',.06,800);noise(1.6,.06,1200,.5)}
};
function startDrone(){const a=ac();if(!a||droneNodes)return;
  const g=a.createGain();g.gain.value=.05;const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=320;f.Q.value=6;
  const o1=a.createOscillator(),o2=a.createOscillator(),o3=a.createOscillator();o1.type='sawtooth';o2.type='sawtooth';o3.type='sine';o1.frequency.value=55;o2.frequency.value=55.6;o3.frequency.value=27.5;
  const l=a.createOscillator(),lg=a.createGain();l.frequency.value=.07;lg.gain.value=220;l.connect(lg).connect(f.frequency);
  const t=a.createOscillator(),tg=a.createGain();t.frequency.value=.21;tg.gain.value=.018;t.connect(tg).connect(g.gain);
  [o1,o2,o3].forEach(o=>o.connect(f));f.connect(g).connect(master);[o1,o2,o3,l,t].forEach(o=>o.start());droneNodes={g};
  setInterval(()=>{if(Math.random()<.5)SFX.geiger()},3800);
  setInterval(()=>{SFX.ping()},9000);
  setInterval(()=>{SFX.heart()},2400);
}

const bg=$('bg'),bx=bg.getContext('2d');bg.width=1920;bg.height=1080;const P=[];
for(let i=0;i<110;i++)P.push({x:Math.random()*1920,y:Math.random()*1080,vx:(Math.random()-.5)*.5,vy:(Math.random()-.5)*.5,r:Math.random()<.1});
let gT=0;
(function draw(){bx.clearRect(0,0,1920,1080);
  for(const p of P){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>1920)p.vx*=-1;if(p.y<0||p.y>1080)p.vy*=-1}
  for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const a=P[i],b=P[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<150){bx.strokeStyle=(a.r||b.r)?`rgba(255,42,61,${.25*(1-d/150)})`:`rgba(0,229,255,${.16*(1-d/150)})`;bx.lineWidth=.8;bx.beginPath();bx.moveTo(a.x,a.y);bx.lineTo(b.x,b.y);bx.stroke()}}
  for(const p of P){bx.fillStyle=p.r?'#ff2a3d':'#00e5ff';bx.beginPath();bx.arc(p.x,p.y,p.r?2.6:1.7,0,7);bx.fill()}
  if(Math.random()<.005)gT=8;if(gT>0){gT--;for(let k=0;k<4;k++){bx.fillStyle=Math.random()<.5?'rgba(255,43,214,.12)':'rgba(0,229,255,.12)';bx.fillRect(0,Math.random()*1080,1920,Math.random()*24)}}
  requestAnimationFrame(draw)})();

const toMin=s=>{const [h,m]=s.split(':').map(Number);return h*60+m};
const SCHED=[...OPENING.map(r=>({s:r[0],e:r[1],t:r[2]})),{s:'11:30',e:'14:00',t:'الجلسات العلمية الحضورية'},...CLOSING.slice(0,2).map(r=>({s:r[0],e:r[1],t:r[2]})),{s:'17:00',e:'19:00',t:'الورشات الأربع عبر تقنية التحاضر عن بعد'}];
function nowInfo(){const d=new Date(),ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),m=d.getHours()*60+d.getMinutes();return{d,ds,m}}
function updClock(){const {d,ds,m}=nowInfo();$('clock').textContent=d.toLocaleTimeString('fr-FR');
  const pill=$('spill'),st=$('stxt');
  if(ds<EVENT_DATE){const tgt=new Date(EVENT_DATE+'T09:00:00');let s=Math.max(0,Math.floor((tgt-d)/1000));const h=Math.floor(s/3600),mm=Math.floor(s%3600/60),ss=s%60;
    pill.textContent='T-MINUS';pill.className='pill';st.innerHTML=`العد التنازلي لانطلاق الملتقى<small class="en">${String(h).padStart(2,'0')}:${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')} → 19.11.2026 · 09:00</small>`;return}
  if(ds>EVENT_DATE){pill.textContent='ARCHIVE';pill.className='pill ok';st.innerHTML='شكراً لكل المشاركين<small>الملتقى الوطني الأول — 19.11.2026</small>';return}
  const cur=SCHED.find(x=>m>=toMin(x.s)&&x.e&&m<toMin(x.e)),nxt=SCHED.find(x=>toMin(x.s)>m);
  if(cur){pill.textContent='● LIVE NOW';pill.className='pill';st.innerHTML=`${esc(cur.t)}<small class="en">${cur.s} → ${cur.e}${nxt?' · NEXT '+nxt.s:''}</small>`}
  else if(nxt){pill.textContent='NEXT '+nxt.s;pill.className='pill ok';st.innerHTML=`${esc(nxt.t)}<small>القادم</small>`}
  else{pill.textContent='END';pill.className='pill ok';st.innerHTML='انتهت فعاليات اليوم — شكراً<small>الملتقى الوطني الأول</small>'}}
setInterval(updClock,1000);updClock();
function isLive(s,e){const {ds,m}=nowInfo();return ds===EVENT_DATE&&e&&m>=toMin(s)&&m<toMin(e)}

const tlHTML=rows=>rows.map(r=>`<div class="ti r${r[2]==='استراحة'?' brk':''}${isLive(r[0],r[1])?' live':''}"><div class="tm">${r[0]}${r[1]?' → '+r[1]:''}</div><div class="tt">${esc(r[2])}${r[3]?`<small>${r[3]}</small>`:''}</div></div>`).join('');
SCENES.push({d:16000,fx:'tl',html:()=>`<div class="sc"><div class="kicker r">OPENING SESSION · 01/02</div><h2 class="r">الجلسة <span class="hl">الافتتاحية</span></h2><div class="sub r">LECTURE HALL · WING F · 09:00</div><div class="tl">${tlHTML(OPENING.slice(0,6))}</div></div>`});
SCENES.push({d:16000,fx:'tl',html:()=>`<div class="sc"><div class="kicker r">OPENING SESSION · 02/02</div><h2 class="r">الجلسة <span class="hl">الافتتاحية</span></h2><div class="sub r">OFFICIAL LAUNCH · KEYNOTE · BREAK</div><div class="tl">${tlHTML(OPENING.slice(6))}</div></div>`});
SCENES.push({d:13000,fx:'kn',html:`<div class="sc kn"><div><div class="kicker r">KEYNOTE · مداخلة افتتاحية</div><div class="who r">البروفيسور <span class="hl">مجاهدي فاتح</span></div><div class="role r">خبير في التسويق وريادة الأعمال</div>
  <div class="panel ttl r">إدراك المستهلك الجزائري لممارسات الخداع التسويقي والإعلاني عبر مواقع التواصل الاجتماعي وأثره على سلوكه الشرائي: دراسة ميدانية</div></div>
  <div class="panel tbox r"><div class="mic"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/></svg></div><div class="big">10:30</div><div class="lbl">→ 10:50 · قاعة المحاضرات — الجناح F</div></div></div>`});
SCENES.push({d:9000,fx:'alert',html:`<div class="sc al"><div class="r"><span class="danger">⚠ VIRALITY ALERT</span></div><div class="num r" style="margin-top:20px"><span data-count="70">0</span>%</div>
  <div class="lab r">احتمال أكبر لإعادة نشر الخبر الزائف مقارنةً بالخبر الصحيح</div><div class="src r">Vosoughi, Roy & Aral — <i>Science</i>, 2018 (MIT)</div></div>`});
SCENES.push({d:13000,fx:'tl',html:()=>`<div class="sc"><div class="kicker r">CLOSING SESSION · 14:00</div><h2 class="r">الجلسة <span class="hl">الختامية</span></h2><div class="sub r">FINAL STATEMENT · CERTIFICATES · REMOTE WORKSHOPS 17:00</div><div class="tl">${tlHTML(CLOSING)}</div></div>`});
/* workshops */
const ALERTS=[
 {d:9000,fx:'alert',html:`<div class="sc al"><div class="r"><span class="danger">⚠ ALGERIA · DZ</span></div><div class="num cy r" style="margin-top:20px"><span data-count="29.4" data-dec="1">0</span>M</div><div class="lab r">هوية على مواقع التواصل الاجتماعي في الجزائر — 61.1% من السكان</div><div class="src r">DataReportal, <i>Digital 2027: Algeria</i> — بيانات أكتوبر 2026</div></div>`},
 {d:9000,fx:'alert',html:`<div class="sc al"><div class="r"><span class="danger">⚠ RED FLAGS · علامات الخطر</span></div><div class="big r" style="font-size:96px;margin-top:20px">تحقّق <span class="hlr">قبل</span> أن تشارك</div>
   <div class="flags"><div class="panel r">عرض «أفضل من أن يكون حقيقياً» وعدّاد استعجال</div><div class="panel r">حساب حديث وتفاعل غير منطقي وتعليقات متشابهة</div><div class="panel r">طلب الدفع المسبق أو التواصل خارج المنصة</div></div></div>`},
 {d:9000,fx:'alert',html:`<div class="sc al"><div class="r"><span class="danger">⚠ DEEPFAKE FRAUD</span></div><div class="num gd r" style="margin-top:20px">$<span data-count="25">0</span>M</div><div class="lab r">حُوِّلت بعد اجتماع فيديو كان كل المشاركين فيه مُزيَّفين بالذكاء الاصطناعي</div><div class="src r">قضية شركة Arup — هونغ كونغ، 2024</div></div>`},
 {d:8000,fx:'alert',html:`<div class="sc al"><div class="tape" style="top:-30px;transform:rotate(-2deg)"><div class="run">${'<span>⚠ VERIFY BEFORE YOU TRUST</span><span>⚠ لا تشارك قبل التحقق</span>'.repeat(6)}</div></div><div class="big r" style="margin-top:40px"><span class="glitch" data-text="المستهلك الواعي">المستهلك الواعي</span><br><span class="hl">هو خط الدفاع الأول</span></div><div class="en2 r">THE AWARE CONSUMER IS THE FIRST LINE OF DEFENSE</div></div>`}
];
const SPLITS={1:[4,4,4],2:[4,4,3],3:[4,3,3],4:[3,3,2]};
WORKSHOPS.forEach((w,wi)=>{const pages=chunk(w.talks,SPLITS[w.n]);
  pages.forEach((pg,pi)=>{SCENES.push({d:9000+pg.length*2600,fx:'ws',html:()=>`<div class="sc"><div class="ws-head"><div>
    <div class="kicker r">WORKSHOP ${NUM[w.n-1]} · REMOTE · ${pi+1}/${pages.length}</div>
    <h2 class="r">${w.name} — <span class="hl">عبر تقنية التحاضر عن بعد</span></h2>
    <div class="ws-meta r"><span class="chip">رئيس الجلسة: <b>${esc(w.chair)}</b></span><span class="chip online">ONLINE · 17:00</span><span class="chip page">${pi+1} / ${pages.length}</span></div></div>
    ${w.link?`<div class="panel qrp r"><div class="ql">امسح للانضمام<b>${w.link.replace('https://','')}</b></div><div class="q">${qrSVG(w.link)}</div></div>`:''}</div>
    <div class="talks">${pg.map(talkHTML).join('')}</div>${pi===pages.length-1?'<div class="disc r">— <span>مناقشة</span> —</div>':''}</div>`})});
  if(ALERTS[wi])SCENES.push(ALERTS[wi]);});
SCENES.push({d:16000,fx:'cm',html:`<div class="sc"><div class="kicker r">ORGANIZING BODY</div><h2 class="r">الهيئة <span class="hl">المشرفة</span> على الملتقى الوطني</h2>
  <div class="cm">${COMMITTEE.map(c=>`<div class="panel cmc r${c[3]?' top':''}"><div class="ro">${esc(c[0])}</div><div class="nm">${esc(c[1])}<small>${esc(c[2])}</small></div></div>`).join('')}</div></div>`});
SCENES.push({d:12000,fx:'ct',html:`<div class="sc ct"><div><div class="kicker r">CONTACT</div><h2 class="r">للتواصل مع <span class="hl">اللجنة التنظيمية</span></h2>
  <div class="line r">✉️ <span class="en">seminaire.umbb@gmail.com</span></div><div class="line r">📞 <span class="en">0666 25 06 55 · 0670 01 27 63</span></div>
  <div class="line r" style="font-size:30px;color:var(--gold)">جامعة امحمد بوقرة بومرداس — كلية العلوم الاقتصادية والتجارية وعلوم التسيير</div></div>
  <div class="panel qrp r" style="flex-direction:column"><div class="q">${qrSVG('mailto:seminaire.umbb@gmail.com')}</div><div class="ql" style="text-align:center">امسح لمراسلتنا</div></div></div>`});

/* ---------- ENGINE ---------- */
const N=SCENES.length;let cur=-1,timers=[],paused=false,tStart=0,remain=0,running=false;
$('dots').innerHTML=SCENES.map(()=>'<i></i>').join('');const dots=[...$('dots').children];
const T=(f,ms)=>{const t=setTimeout(f,ms);timers.push(t);return t};
function clearT(){timers.forEach(clearTimeout);timers=[]}
function flash(){const f=$('flash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go')}
function alertFrame(){const a=$('alertframe');a.classList.remove('on');void a.offsetWidth;a.classList.add('on')}
function countUp(el){const to=+el.dataset.count,dec=+(el.dataset.dec||0),t0=performance.now();(function f(){const k=Math.min(1,(performance.now()-t0)/1500);el.textContent=(to*(1-Math.pow(1-k,3))).toFixed(dec);if(k<1)requestAnimationFrame(f)})()}
function show(i){clearT();const box=$('scene'),old=box.firstElementChild;cur=(i+N)%N;const S=SCENES[cur];
  if(old){old.classList.add('out');SFX.glitch();flash();}
  T(()=>{SFX.boom();if(S.fx==='alert'){SFX.klaxon(3);alertFrame();}else if(cur%2)SFX.whoosh();else SFX.siren();
    box.innerHTML=typeof S.html==='function'?S.html():S.html;
    const items=[...box.querySelectorAll('.r')];
    items.forEach((el,k)=>T(()=>{el.classList.add('in');if(el.classList.contains('talk')){SFX.ping();el.classList.add('hit');[...Array(6)].forEach((_,j)=>T(SFX.tick,j*45))}else if(el.classList.contains('ti')||el.classList.contains('cmc'))SFX.tick()},150+k*(S.fx==='ws'?380:S.fx==='tl'||S.fx==='cm'?170:260)));
    box.querySelectorAll('[data-count]').forEach(el=>T(()=>countUp(el),700));
    if(S.fx==='alert')T(()=>SFX.alarm(2),1800);
  },old?600:0);
  dots.forEach((d,k)=>{d.className=k===cur?'on':k<cur?'done':''});$('scn').textContent=String(cur+1).padStart(2,'0')+'/'+N;
  remain=S.d;startProg();}
let progRAF=null;
function startProg(){tStart=performance.now();const p=$('prog'),dur=remain,base=SCENES[cur].d;cancelAnimationFrame(progRAF);
  (function f(){if(paused)return;const el=performance.now()-tStart;const left=dur-el;p.style.width=(100*(1-Math.max(0,left)/base))+'%';
    if(left<=0){show(cur+1);return}progRAF=requestAnimationFrame(f)})();}
function togglePause(){paused=!paused;$('paused').classList.toggle('on',paused);if(paused){remain-=performance.now()-tStart;cancelAnimationFrame(progRAF)}else startProg()}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2000)}
async function start(){if(running)return;running=true;ac();setVol();startDrone();$('start').style.display='none';SFX.riser();
  try{await document.documentElement.requestFullscreen()}catch(e){}
  try{if('wakeLock' in navigator){let wl=await navigator.wakeLock.request('screen');document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible')try{wl=await navigator.wakeLock.request('screen')}catch(e){}})}}catch(e){}
  setTimeout(()=>show(0),1400);}
$('start').onclick=start;
addEventListener('keydown',e=>{const k=e.key;
  if(!running){if(k==='Enter'||k===' '){e.preventDefault();start()}return}
  if(k===' '){e.preventDefault();togglePause()}
  else if(k==='ArrowRight'||k==='PageDown'){if(paused)togglePause();show(cur+1)}
  else if(k==='ArrowLeft'||k==='PageUp'){if(paused)togglePause();show(cur-1)}
  else if(k==='f'||k==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}
  else if(k==='m'||k==='M'){muted=!muted;setVol();toast(muted?'SOUND OFF':'SOUND ON')}
  else if(k==='v'||k==='V'){volLvl=volLvl%3+1;muted=false;setVol();toast('VOLUME '+volLvl)}
  else if(k==='Home')show(0);});
let idleT;addEventListener('mousemove',()=>{document.body.classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(()=>document.body.classList.add('idle'),2500)});
})();
</script>
